<style>
  :root {
    --bg: #07070d;
    --bg-soft: #0c0c14;
    --ink: #eceaf2;
    --muted: #a9a4bd;
    --faint: #6f6a84;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #8b7cf6;
    --accent-2: #2dd4bf;
    --card: rgba(255, 255, 255, 0.035);
    --pill: rgba(12, 12, 20, 0.55);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.6;
  }
  ::selection { background: rgba(139, 124, 246, 0.4); }

  /* ============ HERO ============ */
  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background: #050509;
    user-select: none;
    -webkit-user-select: none;
  }
  #fluid {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;              /* full-screen canvas: every touch stirs the fluid */
    cursor: crosshair;
  }
  .hero-fallback {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 50% at 20% 30%, rgba(99, 60, 220, 0.35), transparent 70%),
      radial-gradient(50% 45% at 80% 25%, rgba(45, 212, 191, 0.25), transparent 70%),
      radial-gradient(70% 60% at 50% 85%, rgba(236, 72, 153, 0.28), transparent 70%),
      #07070d;
  }
  .hero-fallback p {
    position: absolute; inset: auto 0 28px 0; text-align: center;
    color: var(--muted); font-size: 13px; margin: 0; padding: 0 24px;
  }

  .hero-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 0 24px 40px;
    pointer-events: none;
  }
  .hero-overlay::before {  /* soft scrim so text stays legible over bright dye */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(58% 46% at 50% 44%, rgba(4, 4, 9, 0.55), transparent 72%);
  }
  .hero-overlay > * { position: relative; }
  .eyebrow {
    margin: 0 0 10px;
    font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--muted);
  }
  h1.name {
    margin: 0;
    font-family: Didot, "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(3rem, 11vw, 6.25rem);
    line-height: 1.02;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 40px rgba(0, 0, 0, 0.65);
  }
  p.role {
    margin: 18px 0 0;
    font-size: clamp(1rem, 2.6vw, 1.25rem);
    color: var(--ink);
    font-weight: 500;
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.7);
  }
  p.role .at { color: var(--muted); font-weight: 400; }

  .social {
    display: flex; gap: 10px; margin-top: 30px;
    pointer-events: auto;
  }
  .social a {
    width: 46px; height: 46px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: rgba(255, 255, 255, 0.82);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .social a:hover, .social a:focus-visible {
    transform: translateY(-3px);
    background: rgba(139, 124, 246, 0.22);
    border-color: rgba(139, 124, 246, 0.65);
    color: #fff;
    outline: none;
  }
  .social svg { width: 20px; height: 20px; display: block; }


</style>

<script>
'use strict';
/* =====================================================================
   Fluid hero — a real-time 2D stable-fluids simulation in WebGL.
   Pipeline: splat -> advect -> curl -> vorticity confine -> divergence
   -> Jacobi pressure solve -> gradient subtract -> display.
   Velocity + dye live in half-float ping-pong framebuffers.
   ===================================================================== */

(function () {
  var canvas = document.getElementById('fluid');

  /* ---------------- configuration ---------------- */
  var config = {
    SIM_RESOLUTION: 128,      // adapted to screen size on resize (128 or 256)
    DYE_RESOLUTION: 512,      // adapted to screen size on resize (512 or 1024)
    DYE_DISSIPATION: 0.18,     // dye decay rate (per second) — low so colors linger and mix
    VELOCITY_DISSIPATION: 0.12,  // velocity decay — low so swirls carry dye around longer
    PRESSURE: 0.8,            // pressure decay per clear
    PRESSURE_ITERATIONS: 20,  // Jacobi iterations
    CURL: 28,                 // vorticity confinement strength
    SPLAT_RADIUS: 0.22,       // gaussian splat radius (fraction of screen)
    SPLAT_FORCE: 5200,        // pointer force scale
    COLOR_INTENSITY: 0.45,    // dye brightness per splat
    MAX_FORCE: 14000          // clamp to keep numerics stable
  };

  /* Tasteful palettes on a near-black background. cycled per pointer-down. */
  var PALETTES = [
    { name: 'nebula',  colors: [[0.42, 0.34, 0.98], [0.05, 0.80, 0.72], [0.96, 0.26, 0.58], [1.00, 0.64, 0.15]] },
    { name: 'ember',   colors: [[0.98, 0.20, 0.26], [1.00, 0.46, 0.10], [1.00, 0.80, 0.26], [0.82, 0.28, 0.55]] },
    { name: 'glacier', colors: [[0.36, 0.64, 1.00], [0.18, 0.90, 0.86], [0.58, 0.42, 1.00], [0.40, 1.00, 0.76]] }
  ];
  var paletteIndex = 0;
  var colorIndex = 0;

  var reducedMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- tiny helpers ---------------- */
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function showFallback(msg) {
    canvas.style.display = 'none';
    var fb = document.getElementById('heroFallback');
    fb.hidden = false;
    if (msg) document.getElementById('fallbackMsg').textContent = msg;
    var stats = document.getElementById('stats');
    if (stats) stats.style.display = 'none';
    var controls = document.getElementById('controls');
    if (controls) controls.style.display = 'none';
  }

  /* ---------------- WebGL context ---------------- */
  function getWebGLContext(canvas) {
    var params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
    var gl = canvas.getContext('webgl2', params);
    var isWebGL2 = !!gl;
    if (!isWebGL2) {
      gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
    }
    if (!gl) return null;

    var halfFloatExt, supportLinearFiltering;
    if (isWebGL2) {
      gl.getExtension('EXT_color_buffer_float'); // render to 16F
      supportLinearFiltering = !!gl.getExtension('OES_texture_float_linear');
    } else {
      halfFloatExt = gl.getExtension('OES_texture_half_float');
      gl.getExtension('EXT_color_buffer_half_float');
      gl.getExtension('WEBGL_color_buffer_float');
      supportLinearFiltering = !!gl.getExtension('OES_texture_half_float_linear');
    }
    if (!isWebGL2 && !halfFloatExt) return null;

    var halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloatExt.HALF_FLOAT_OES;
    var formatRGBA, formatRG, formatR;
    if (isWebGL2) {
      formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
      formatRG   = getSupportedFormat(gl, gl.RG16F,   gl.RG,   halfFloatTexType);
      formatR    = getSupportedFormat(gl, gl.R16F,    gl.RED,  halfFloatTexType);
    } else {
      formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
      formatRG   = formatRGBA;
      formatR    = formatRGBA;
    }
    if (!formatRGBA) return null; // cannot render to half float -> graceful fallback
    return {
      gl: gl,
      ext: {
        formatRGBA: formatRGBA, formatRG: formatRG, formatR: formatR,
        halfFloatTexType: halfFloatTexType,
        supportLinearFiltering: supportLinearFiltering
      }
    };
  }

  function getSupportedFormat(gl, internalFormat, format, type) {
    if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
      switch (internalFormat) {
        case gl.R16F:  return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
        case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
        default: return null;
      }
    }
    return { internalFormat: internalFormat, format: format };
  }

  function supportRenderTextureFormat(gl, internalFormat, format, type) {
    if (type == null) return false;
    var texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.deleteFramebuffer(fbo);
    gl.deleteTexture(texture);
    return ok;
  }

  var ctx = getWebGLContext(canvas);
  if (!ctx) { showFallback(); return; }
  var gl = ctx.gl;
  var ext = ctx.ext;

  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    showFallback('The graphics context was lost — reloading the page should bring the fluid back.');
  });

  /* ---------------- shaders ---------------- */
  function compileShader(type, source, keywords) {
    if (keywords && keywords.length) {
      var kw = '';
      for (var i = 0; i < keywords.length; i++) kw += '#define ' + keywords[i] + '\n';
      source = kw + source;
    }
    var shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
      console.error('shader error:', gl.getShaderInfoLog(shader));
    return shader;
  }

  function createProgram(vs, fs) {
    var program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.bindAttribLocation(program, 0, 'aPosition');
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS))
      console.error('program error:', gl.getProgramInfoLog(program));
    return program;
  }

  function getUniforms(program) {
    var uniforms = {};
    var count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < count; i++) {
      var name = gl.getActiveUniform(program, i).name;
      uniforms[name] = gl.getUniformLocation(program, name);
    }
    return uniforms;
  }

  function Program(vertexShader, fsSource, keywords) {
    this.program = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, fsSource, keywords));
    this.uniforms = getUniforms(this.program);
  }
  Program.prototype.bind = function () { gl.useProgram(this.program); };

  var baseVertexShader = compileShader(gl.VERTEX_SHADER, [
    'precision highp float;',
    'attribute vec2 aPosition;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform vec2 texelSize;',
    'void main () {',
    '    vUv = aPosition * 0.5 + 0.5;',
    '    vL = vUv - vec2(texelSize.x, 0.0);',
    '    vR = vUv + vec2(texelSize.x, 0.0);',
    '    vT = vUv + vec2(0.0, texelSize.y);',
    '    vB = vUv - vec2(0.0, texelSize.y);',
    '    gl_Position = vec4(aPosition, 0.0, 1.0);',
    '}'
  ].join('\n'));

  var splatShader = [
    'precision highp float;',
    'precision highp sampler2D;',
    'varying vec2 vUv;',
    'uniform sampler2D uTarget;',
    'uniform float aspectRatio;',
    'uniform vec3 uColor;',
    'uniform vec2 uPoint;',
    'uniform float uRadius;',
    'void main () {',
    '    vec2 p = vUv - uPoint.xy;',
    '    p.x *= aspectRatio;',
    '    vec3 splat = exp(-dot(p, p) / uRadius) * uColor;',
    '    vec3 base = texture2D(uTarget, vUv).xyz;',
    '    gl_FragColor = vec4(base + splat, 1.0);',
    '}'
  ].join('\n');

  var advectionShader = [
    'precision highp float;',
    'precision highp sampler2D;',
    'varying vec2 vUv;',
    'uniform sampler2D uVelocity;',
    'uniform sampler2D uSource;',
    'uniform vec2 velTexelSize;',
    'uniform vec2 dyeTexelSize;',
    'uniform float dt;',
    'uniform float dissipation;',
    '#ifdef MANUAL_FILTERING',
    'vec4 bilerp (sampler2D tex, vec2 uv, vec2 tsize) {',
    '    vec2 st = uv / tsize - 0.5;',
    '    vec2 iuv = floor(st);',
    '    vec2 fuv = fract(st);',
    '    vec4 a = texture2D(tex, (iuv + vec2(0.5, 0.5)) * tsize);',
    '    vec4 b = texture2D(tex, (iuv + vec2(1.5, 0.5)) * tsize);',
    '    vec4 c = texture2D(tex, (iuv + vec2(0.5, 1.5)) * tsize);',
    '    vec4 d = texture2D(tex, (iuv + vec2(1.5, 1.5)) * tsize);',
    '    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);',
    '}',
    '#endif',
    'void main () {',
    '#ifdef MANUAL_FILTERING',
    '    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, velTexelSize).xy * velTexelSize;',
    '    vec4 result = bilerp(uSource, coord, dyeTexelSize);',
    '#else',
    '    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * velTexelSize;',
    '    vec4 result = texture2D(uSource, coord);',
    '#endif',
    '    float decay = 1.0 + dissipation * dt;',
    '    gl_FragColor = result / decay;',
    '}'
  ].join('\n');

  var divergenceShader = [
    'precision mediump float;',
    'precision mediump sampler2D;',
    'varying highp vec2 vUv;',
    'varying highp vec2 vL;',
    'varying highp vec2 vR;',
    'varying highp vec2 vT;',
    'varying highp vec2 vB;',
    'uniform sampler2D uVelocity;',
    'void main () {',
    '    float L = texture2D(uVelocity, vL).x;',
    '    float R = texture2D(uVelocity, vR).x;',
    '    float T = texture2D(uVelocity, vT).y;',
    '    float B = texture2D(uVelocity, vB).y;',
    '    vec2 C = texture2D(uVelocity, vUv).xy;',
    '    if (vL.x < 0.0) { L = -C.x; }',
    '    if (vR.x > 1.0) { R = -C.x; }',
    '    if (vT.y > 1.0) { T = -C.y; }',
    '    if (vB.y < 0.0) { B = -C.y; }',
    '    float div = 0.5 * (R - L + T - B);',
    '    gl_FragColor = vec4(div, 0.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  var curlShader = [
    'precision mediump float;',
    'precision mediump sampler2D;',
    'varying highp vec2 vUv;',
    'varying highp vec2 vL;',
    'varying highp vec2 vR;',
    'varying highp vec2 vT;',
    'varying highp vec2 vB;',
    'uniform sampler2D uVelocity;',
    'void main () {',
    '    float L = texture2D(uVelocity, vL).y;',
    '    float R = texture2D(uVelocity, vR).y;',
    '    float T = texture2D(uVelocity, vT).x;',
    '    float B = texture2D(uVelocity, vB).x;',
    '    float vorticity = R - L - T + B;',
    '    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  var vorticityShader = [
    'precision highp float;',
    'precision highp sampler2D;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform sampler2D uVelocity;',
    'uniform sampler2D uCurl;',
    'uniform float curl;',
    'uniform float dt;',
    'void main () {',
    '    float L = texture2D(uCurl, vL).x;',
    '    float R = texture2D(uCurl, vR).x;',
    '    float T = texture2D(uCurl, vT).x;',
    '    float B = texture2D(uCurl, vB).x;',
    '    float C = texture2D(uCurl, vUv).x;',
    '    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));',
    '    force /= length(force) + 0.0001;',
    '    force *= curl * C;',
    '    force.y *= -1.0;',
    '    vec2 velocity = texture2D(uVelocity, vUv).xy;',
    '    velocity += force * dt;',
    '    velocity = min(max(velocity, -1000.0), 1000.0);',
    '    gl_FragColor = vec4(velocity, 0.0, 1.0);',
    '}'
  ].join('\n');

  var pressureShader = [
    'precision mediump float;',
    'precision mediump sampler2D;',
    'varying highp vec2 vUv;',
    'varying highp vec2 vL;',
    'varying highp vec2 vR;',
    'varying highp vec2 vT;',
    'varying highp vec2 vB;',
    'uniform sampler2D uPressure;',
    'uniform sampler2D uDivergence;',
    'void main () {',
    '    float L = texture2D(uPressure, vL).x;',
    '    float R = texture2D(uPressure, vR).x;',
    '    float T = texture2D(uPressure, vT).x;',
    '    float B = texture2D(uPressure, vB).x;',
    '    float divergence = texture2D(uDivergence, vUv).x;',
    '    float pressure = (L + R + B + T - divergence) * 0.25;',
    '    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  var gradientSubtractShader = [
    'precision mediump float;',
    'precision mediump sampler2D;',
    'varying highp vec2 vUv;',
    'varying highp vec2 vL;',
    'varying highp vec2 vR;',
    'varying highp vec2 vT;',
    'varying highp vec2 vB;',
    'uniform sampler2D uPressure;',
    'uniform sampler2D uVelocity;',
    'void main () {',
    '    float L = texture2D(uPressure, vL).x;',
    '    float R = texture2D(uPressure, vR).x;',
    '    float T = texture2D(uPressure, vT).x;',
    '    float B = texture2D(uPressure, vB).x;',
    '    vec2 velocity = texture2D(uVelocity, vUv).xy;',
    '    velocity.xy -= vec2(R - L, T - B);',
    '    gl_FragColor = vec4(velocity, 0.0, 1.0);',
    '}'
  ].join('\n');

  var clearShader = [
    'precision mediump float;',
    'precision mediump sampler2D;',
    'varying highp vec2 vUv;',
    'uniform sampler2D uTexture;',
    'uniform float value;',
    'void main () {',
    '    gl_FragColor = value * texture2D(uTexture, vUv);',
    '}'
  ].join('\n');

  var displayShader = [
    'precision highp float;',
    'precision highp sampler2D;',
    'varying vec2 vUv;',
    'uniform sampler2D uTexture;',
    'uniform vec2 dyeTexelSize;',
    '#ifdef MANUAL_FILTERING',
    'vec4 bilerp (sampler2D tex, vec2 uv, vec2 tsize) {',
    '    vec2 st = uv / tsize - 0.5;',
    '    vec2 iuv = floor(st);',
    '    vec2 fuv = fract(st);',
    '    vec4 a = texture2D(tex, (iuv + vec2(0.5, 0.5)) * tsize);',
    '    vec4 b = texture2D(tex, (iuv + vec2(1.5, 0.5)) * tsize);',
    '    vec4 c = texture2D(tex, (iuv + vec2(0.5, 1.5)) * tsize);',
    '    vec4 d = texture2D(tex, (iuv + vec2(1.5, 1.5)) * tsize);',
    '    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);',
    '}',
    '#endif',
    'void main () {',
    '#ifdef MANUAL_FILTERING',
    '    vec3 dye = bilerp(uTexture, vUv, dyeTexelSize).rgb;',
    '#else',
    '    vec3 dye = texture2D(uTexture, vUv).rgb;',
    '#endif',
    '    vec3 col = vec3(0.010, 0.010, 0.020) + dye;',   // near-black blue base
    '    col = col / (1.0 + col * 0.12);',                // soft highlight rolloff
    '    float d = distance(vUv, vec2(0.5, 0.46));',
    '    col *= 1.0 - smoothstep(0.35, 1.0, d) * 0.5;',   // vignette
    '    col += vec3(0.012, 0.010, 0.026) * (1.0 - vUv.y);', // faint top glow
    '    gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  var filteringKeywords = ext.supportLinearFiltering ? [] : ['MANUAL_FILTERING'];
  var splatProgram            = new Program(baseVertexShader, splatShader);
  var advectionProgram        = new Program(baseVertexShader, advectionShader, filteringKeywords);
  var divergenceProgram       = new Program(baseVertexShader, divergenceShader);
  var curlProgram             = new Program(baseVertexShader, curlShader);
  var vorticityProgram        = new Program(baseVertexShader, vorticityShader);
  var pressureProgram         = new Program(baseVertexShader, pressureShader);
  var gradientSubtractProgram = new Program(baseVertexShader, gradientSubtractShader);
  var clearProgram            = new Program(baseVertexShader, clearShader);
  var displayProgram          = new Program(baseVertexShader, displayShader, filteringKeywords);

  /* ---------------- fullscreen blit quad ---------------- */
  var blit = (function () {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(0);
    return function (target, clear) {
      if (target == null) {
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      } else {
        gl.viewport(0, 0, target.width, target.height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
      }
      if (clear) {
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
      } else {
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
      }
    };
  })();

  /* ---------------- framebuffers ---------------- */
  var liveFBOs = [];

  function createFBO(w, h, internalFormat, format, type, param) {
    gl.activeTexture(gl.TEXTURE0);
    var texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    var f = {
      texture: texture, fbo: fbo, width: w, height: h,
      texelSizeX: 1 / w, texelSizeY: 1 / h,
      attach: function (id) {
        gl.activeTexture(gl.TEXTURE0 + id);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return id;
      },
      destroy: function () { gl.deleteTexture(texture); gl.deleteFramebuffer(fbo); }
    };
    liveFBOs.push(f);
    return f;
  }

  function createDoubleFBO(w, h, internalFormat, format, type, param) {
    var fbo1 = createFBO(w, h, internalFormat, format, type, param);
    var fbo2 = createFBO(w, h, internalFormat, format, type, param);
    return {
      width: w, height: h,
      texelSizeX: fbo1.texelSizeX, texelSizeY: fbo1.texelSizeY,
      _read: fbo1, _write: fbo2,
      get read() { return this._read; },
      set read(v) { this._read = v; },
      get write() { return this._write; },
      set write(v) { this._write = v; },
      swap: function () { var t = this._read; this._read = this._write; this._write = t; }
    };
  }

  function getResolution(resolution) {
    var aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
    if (aspectRatio < 1) aspectRatio = 1 / aspectRatio;
    var min = Math.round(resolution);
    var max = Math.round(resolution * aspectRatio);
    if (gl.drawingBufferWidth > gl.drawingBufferHeight)
      return { width: max, height: min };
    return { width: min, height: max };
  }

  var dye, velocity, divergence, curl, pressure;
  var simW = 0, simH = 0;

  function initFramebuffers() {
    for (var i = 0; i < liveFBOs.length; i++) liveFBOs[i].destroy();
    liveFBOs.length = 0;

    var simRes = getResolution(config.SIM_RESOLUTION);
    var dyeRes = getResolution(config.DYE_RESOLUTION);
    simW = simRes.width; simH = simRes.height;

    var texType = ext.halfFloatTexType;
    var filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
    gl.disable(gl.BLEND);

    dye = createDoubleFBO(dyeRes.width, dyeRes.height,
      ext.formatRGBA.internalFormat, ext.formatRGBA.format, texType, filtering);
    velocity = createDoubleFBO(simRes.width, simRes.height,
      ext.formatRG.internalFormat, ext.formatRG.format, texType, filtering);
    divergence = createFBO(simRes.width, simRes.height,
      ext.formatR.internalFormat, ext.formatR.format, texType, gl.NEAREST);
    curl = createFBO(simRes.width, simRes.height,
      ext.formatR.internalFormat, ext.formatR.format, texType, gl.NEAREST);
    pressure = createDoubleFBO(simRes.width, simRes.height,
      ext.formatR.internalFormat, ext.formatR.format, texType, gl.NEAREST);
  }

  /* ---------------- simulation kernels ---------------- */
  function correctRadius(radius) {
    var aspectRatio = canvas.width / canvas.height;
    if (aspectRatio > 1) radius *= aspectRatio;
    else radius /= Math.max(aspectRatio, 0.4); // portrait: scale up so splats fill tall screens
    return radius;
  }
  function correctDeltaX(delta) {
    var aspectRatio = canvas.width / canvas.height;
    if (aspectRatio < 1) delta *= aspectRatio;
    return delta;
  }
  function correctDeltaY(delta) {
    var aspectRatio = canvas.width / canvas.height;
    if (aspectRatio > 1) delta /= aspectRatio;
    return delta;
  }

  function splat(x, y, dx, dy, color) {
    splatProgram.bind();
    gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform2f(splatProgram.uniforms.uPoint, x, y);
    gl.uniform3f(splatProgram.uniforms.uColor, dx, dy, 0.0);
    gl.uniform1f(splatProgram.uniforms.uRadius, correctRadius(config.SPLAT_RADIUS / 100.0));
    blit(velocity.write);
    velocity.swap();

    gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(splatProgram.uniforms.uColor, color[0], color[1], color[2]);
    blit(dye.write);
    dye.swap();
  }

  function step(dt) {
    gl.disable(gl.BLEND);

    // curl
    curlProgram.bind();
    gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(curl);

    // vorticity confinement
    vorticityProgram.bind();
    gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
    gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
    gl.uniform1f(vorticityProgram.uniforms.dt, dt);
    blit(velocity.write);
    velocity.swap();

    // divergence
    divergenceProgram.bind();
    gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    // pressure decay + Jacobi solve
    clearProgram.bind();
    gl.uniform2f(clearProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE);
    blit(pressure.write);
    pressure.swap();

    pressureProgram.bind();
    gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
    for (var i = 0; i < config.PRESSURE_ITERATIONS; i++) {
      gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
      blit(pressure.write);
      pressure.swap();
    }

    // gradient subtract (make velocity divergence-free)
    gradientSubtractProgram.bind();
    gl.uniform2f(gradientSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(gradientSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(gradientSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write);
    velocity.swap();

    // advect velocity
    advectionProgram.bind();
    gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    if (advectionProgram.uniforms.dyeTexelSize)
      gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
    var velocityId = velocity.read.attach(0);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
    gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
    gl.uniform1f(advectionProgram.uniforms.dt, dt);
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
    blit(velocity.write);
    velocity.swap();

    // advect dye
    if (advectionProgram.uniforms.dyeTexelSize)
      gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.DYE_DISSIPATION);
    blit(dye.write);
    dye.swap();
  }

  function render() {
    displayProgram.bind();
    if (displayProgram.uniforms.dyeTexelSize)
      gl.uniform2f(displayProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
    gl.uniform1i(displayProgram.uniforms.uTexture, dye.read.attach(0));
    blit(null);
  }

  function clearDye() {
    blit(dye.read, true);
    blit(dye.write, true);
  }

  /* ---------------- color ---------------- */
  function nextPaletteColor() {
    var pal = PALETTES[paletteIndex].colors;
    var c = pal[colorIndex % pal.length];
    colorIndex++;
    // subtle per-splat variation keeps repeated drags lively
    var v = 0.92 + Math.random() * 0.16;
    return [c[0] * v * config.COLOR_INTENSITY,
            c[1] * v * config.COLOR_INTENSITY,
            c[2] * v * config.COLOR_INTENSITY];
  }
  function randomPaletteColor() {
    var pal = PALETTES[paletteIndex].colors;
    var c = pal[(Math.random() * pal.length) | 0];
    return [c[0] * config.COLOR_INTENSITY, c[1] * config.COLOR_INTENSITY, c[2] * config.COLOR_INTENSITY];
  }

  /* ---------------- pointer input ---------------- */
  var pointers = new Map();
  var lastActive = performance.now();

  function toUV(e) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width,
      y: 1.0 - (e.clientY - r.top) / r.height
    };
  }

  canvas.addEventListener('pointerdown', function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    var uv = toUV(e);
    pointers.set(e.pointerId, {
      x: uv.x, y: uv.y, dx: 0, dy: 0,
      down: true, moved: false,
      color: nextPaletteColor()
    });
    // a tap leaves a small mark even without movement
    splat(uv.x, uv.y, 0, 0, pointers.get(e.pointerId).color);
    lastActive = performance.now();
  });

  canvas.addEventListener('pointermove', function (e) {
    var p = pointers.get(e.pointerId);
    if (!p || !p.down) return;
    var uv = toUV(e);
    var dx = clamp(correctDeltaX(uv.x - p.x) * config.SPLAT_FORCE, -config.MAX_FORCE, config.MAX_FORCE);
    var dy = clamp(correctDeltaY(uv.y - p.y) * config.SPLAT_FORCE, -config.MAX_FORCE, config.MAX_FORCE);
    p.x = uv.x; p.y = uv.y;
    // accumulate so rapid moves between frames don't lose momentum
    p.dx = clamp(p.dx + dx, -config.MAX_FORCE, config.MAX_FORCE);
    p.dy = clamp(p.dy + dy, -config.MAX_FORCE, config.MAX_FORCE);
    p.moved = true;
    lastActive = performance.now();
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function updatePointers() {
    pointers.forEach(function (p) {
      if (p.moved) {
        p.moved = false;
        splat(p.x, p.y, p.dx, p.dy, p.color);
        p.dx = 0; p.dy = 0; // consume the accumulated momentum
      }
    });
  }

  /* ---------------- auto demo ---------------- */
  var autoDemo = true; // always on — controls removed
  var lastAutoSplat = 0;
  var idleCount = 0;

  function autoSplat(big) {
    var x = 0.15 + Math.random() * 0.7;
    var y = 0.15 + Math.random() * 0.7;
    var a = Math.random() * Math.PI * 2;
    var f = big ? 6500 + Math.random() * 4500 : 4000 + Math.random() * 3000;
    splat(x, y, Math.cos(a) * f, Math.sin(a) * f, randomPaletteColor());
  }

  function openingBloom() {
    // staggered splats spread over ~3s so the hero blooms gracefully and
    // hands off smoothly into the idle rhythm (no burst-then-quiet)
    var n = 10;
    for (var i = 0; i < n; i++) {
      (function (k) {
        setTimeout(function () { autoSplat(k % 3 === 0); }, 300 * k);
      })(i);
    }
  }

  /* ---------------- auto gestures: swipes & orbits ---------------- */
  // Periodic simulated touch gestures — an invisible finger that swipes
  // and spirals through the fluid on its own. Reuses the same splat path
  // as real pointer drags so the streaks look identical.
  var autoMotion = null; // active gesture, or null between gestures
  var nextMotionAt = performance.now() + 3000; // first gesture shortly after load

  function scheduleNextMotion(now) {
    nextMotionAt = now + 5000 + Math.random() * 7000; // a gesture every 5–12s
  }

  function startAutoMotion(now) {
    var cx = 0.2 + Math.random() * 0.6;
    var cy = 0.2 + Math.random() * 0.6;
    var color = randomPaletteColor();
    var force = 2600 + Math.random() * 2200;
    if (Math.random() < 0.62) {
      // swipe: a curved drag across the screen
      var ang = Math.random() * Math.PI * 2;
      var len = 0.45 + Math.random() * 0.45;
      autoMotion = {
        type: 'swipe',
        x0: cx, y0: cy,
        dx: Math.cos(ang) * len, dy: Math.sin(ang) * len,
        curve: (Math.random() - 0.5) * 0.7, // sideways bow of the path
        t: 0, dur: 0.6 + Math.random() * 0.7,
        force: force, color: color
      };
    } else {
      // orbit: a circular stir that winds the dye into a spiral
      autoMotion = {
        type: 'orbit',
        cx: cx, cy: cy,
        r: 0.12 + Math.random() * 0.16,
        a0: Math.random() * Math.PI * 2,
        turns: (Math.random() < 0.5 ? -1 : 1) * (1 + Math.random() * 1.25),
        t: 0, dur: 1.4 + Math.random() * 1.2,
        force: force, color: color
      };
    }
    scheduleNextMotion(now);
  }

  function updateAutoMotion(now, dt) {
    if (!autoMotion) {
      if (now < nextMotionAt) return;
      if (now - lastActive < 3000) { nextMotionAt = now + 2000; return; } // don't fight the user's finger
      startAutoMotion(now);
      return;
    }
    var m = autoMotion;
    m.t += dt;
    var k = Math.min(m.t / m.dur, 1);
    var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; // easeInOutQuad
    var x, y, vx, vy;
    if (m.type === 'swipe') {
      var bx = m.x0 + m.dx * e, by = m.y0 + m.dy * e;
      var bow = Math.sin(e * Math.PI) * m.curve;
      x = bx + (-m.dy) * bow;
      y = by + (m.dx) * bow;
      var inv = 1 / Math.max(0.0001, Math.sqrt(m.dx * m.dx + m.dy * m.dy));
      vx = m.dx * inv * m.force;
      vy = m.dy * inv * m.force;
    } else {
      var a = m.a0 + m.turns * Math.PI * 2 * e;
      x = m.cx + Math.cos(a) * m.r;
      y = m.cy + Math.sin(a) * m.r;
      var dir = m.turns > 0 ? 1 : -1; // tangential velocity
      vx = -Math.sin(a) * dir * m.force;
      vy = Math.cos(a) * dir * m.force;
    }
    splat(clamp(x, 0.03, 0.97), clamp(y, 0.03, 0.97), vx, vy, m.color);
    if (k >= 1) autoMotion = null;
  }

  /* ---------------- resize (HiDPI aware) ---------------- */
  var resizeTimer = null;
  function resizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
    var h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width === w && canvas.height === h) return;
    canvas.width = w;
    canvas.height = h;
    var px = w * h;
    config.SIM_RESOLUTION = px > 1500000 ? 256 : 128;
    config.DYE_RESOLUTION = px > 1500000 ? 1024 : 512;
    initFramebuffers();
    if (!reducedMotion && !paused) { autoSplat(true); autoSplat(true); }
    else { render(); }
  }
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 150);
  });

  /* ---------------- main loop ---------------- */
  var paused = false;
  var lastTime = performance.now();
  var simAcc = 0; // fixed-timestep accumulator: keeps sim speed correct at any fps

  function frame(now) {
    requestAnimationFrame(frame);
    var rawDt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if (!paused) {
      updatePointers();
      // fixed 1/60 substeps (max 4/frame) — stable numerics, correct speed even at low fps
      simAcc += rawDt;
      var n = 0;
      while (simAcc >= 1 / 60 && n < 4) {
        step(1 / 60);
        simAcc -= 1 / 60;
        n++;
      }
      if (n === 4) simAcc = 0; // shed backlog instead of spiraling
      // lively ambient motion when idle so the hero stays colorful
      if (autoDemo && now - lastActive > 500 && now - lastAutoSplat > 1500) {
        idleCount++;
        autoSplat(idleCount % 4 === 0); // every 4th puff is a big one
        lastAutoSplat = now;
      }
      // auto gestures: swipes & spiral stirs, like an invisible finger
      updateAutoMotion(now, rawDt);
    }
    render();
  }

  /* ---------------- boot ---------------- */
  resizeCanvas();
  if (reducedMotion) {
    // one calm, composed frame — no animation
    for (var i = 0; i < 5; i++) {
      (function () {
        var x = 0.2 + Math.random() * 0.6, y = 0.25 + Math.random() * 0.5;
        var a = Math.random() * Math.PI * 2;
        splat(x, y, Math.cos(a) * 900, Math.sin(a) * 900, randomPaletteColor());
      })();
    }
    for (var s = 0; s < 14; s++) step(1 / 60);
    render();
  } else {
    openingBloom();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
